
<!DOCTYPE html>

<head>

<title>Small Light | 平和な未来へ</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#24364b;line-height:1.8}
header{background:linear-gradient(135deg,#102b47,#27658c);color:white;text-align:center;padding:65px 20px}

.languages{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:30px}

section{background:white;padding:30px;margin:25px 0;border-radius:14px}
h2{color:#194b77}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
article{background:#edf4fa;padding:22px;border-radius:12px}
footer{background:#102b47;color:white;text-align:center;padding:25px}

</head>
<body>

<footer>Small Light — From Small Lights to a Peaceful Future.</footer>
<script>
const translations={
ja:{
tagline:"小さな光から、平和な未来へ。",
intro:"世界中の若者が語り合い、ともに行動する。",
navVision:"理念",navActivities:"活動",navJoin:"参加",
visionTitle:"私たちの理念 | Our Vision",
vision1:"Small Light は、世界中の若者が国籍、民族、宗教、文化、思想の違いを超えて対話し、戦争のない平和な社会を目指す場所です。",
vision2:"互いの声に耳を傾け、違いを尊重し、平和のために共に考え、行動します。",
vision3:"一人の小さな光が、次の光をともす。その光が世界中に広がることを願っています。",
activitiesTitle:"私たちの活動 | Our Activities",
dialogueTitle:"対話 | Dialogue",
dialogueText:"世界中の若者が平和について自由に語り合い、互いの理解を深めます。",
actionTitle:"行動 | Action",
actionText:"対話から生まれたアイデアを具体的な平和活動へとつなげます。",
joinTitle:"共に未来をつくる | Join Us",
join1:"Small Light は、平和を願うすべての人に開かれた場所を目指しています。",
join2:"現在、国際的な対話と交流の仕組みを準備しています。"
},
en:{
tagline:"From Small Lights to a Peaceful Future.",
intro:"Young people around the world, talking and taking action together.",
navVision:"Vision",navActivities:"Activities",navJoin:"Join Us",
visionTitle:"Our Vision",
vision1:"Small Light aims to be a place where young people worldwide can engage in dialogue across differences of nationality, ethnicity, religion, culture and beliefs, working toward a world without war.",
vision2:"We listen to one another, respect our differences, and think and act together for peace.",
vision3:"One small light can kindle another. We hope these lights will spread across the world.",
activitiesTitle:"Our Activities",
dialogueTitle:"Dialogue",
dialogueText:"Young people around the world share their thoughts about peace and deepen mutual understanding.",
actionTitle:"Action",
actionText:"We aim to turn ideas born through dialogue into practical activities for peace.",
joinTitle:"Building the Future Together",
join1:"Small Light aspires to be open to everyone who hopes for peace.",
join2:"We are preparing ways for international dialogue and exchange."
},
zh:{
tagline:"从点点微光，走向和平的未来。",
intro:"让世界各地的年轻人共同对话、携手行动。",
navVision:"理念",navActivities:"活动",navJoin:"参与",
visionTitle:"我们的理念",
vision1:"Small Light 致力于为世界各地的年轻人提供一个交流平台，跨越国籍、民族、宗教、文化和思想的差异，共同追求没有战争的和平社会。",
vision2:"我们倾听彼此的声音，尊重差异，共同思考并为和平采取行动。",
vision3:"一束微光可以点亮另一束微光。我们希望这些光芒传遍世界。",
activitiesTitle:"我们的活动",
dialogueTitle:"对话",
dialogueText:"让世界各地的年轻人自由交流对和平的看法，增进相互理解。",
actionTitle:"行动",
actionText:"将对话中产生的想法转化为具体的和平行动。",
joinTitle:"共同创造未来",
join1:"Small Light 希望成为一个向所有热爱和平的人开放的平台。",
join2:"我们正在筹备国际对话与交流的机制。"
}
};
function setLanguage(lang){
const t=translations[lang];
if(!t)return;
document.documentElement.lang=lang;
Object.keys(t).forEach(id=>{
const el=document.getElementById(id);
if(el)el.textContent=t[id];
});
document.querySelectorAll("[data-lang]").forEach(btn=>{
const active=btn.dataset.lang===lang;
btn.classList.toggle("active",active);
btn.setAttribute("aria-pressed",String(active));
});
}
document.querySelectorAll("[data-lang]").forEach(btn=>
btn.addEventListener("click",()=>setLanguage(btn.dataset.lang))
);
setLanguage("ja");
</script>
